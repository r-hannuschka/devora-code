@if (activeSession(); as activeSession) {
  <dl class="active-session">
    <dt>Issue:</dt>
    <dd class="issue-key">{{ activeSession.issueKey }}</dd>

    <dt>Start:</dt>
    <dd class="start-time">{{ activeSession.startAt| date: 'HH:mm' }}</dd>

    <dt>Dauer:</dt>
    <dd class="elapsed">{{ elapsed.value() }}</dd>
  </dl>
}
