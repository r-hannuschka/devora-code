<div class="racetrack-widget">
  <svg
    viewBox="0 0 800 120"
    fill="none"
    xmlns="http://w3.org"
    style="background: #1e1e1e; width: 100%; border-radius: 6px"
  >
    <!-- Begrenzungslinien & Straße -->
    <line x1="0" y1="45" x2="800" y2="45" stroke="#333333" stroke-width="1" />
    <rect y="50" width="800" height="25" fill="#252526" />
    <path d="M0 62.5 H800" stroke="#3c3c3c" stroke-width="1.5" stroke-dasharray="10 10" />
    <line x1="0" y1="80" x2="800" y2="80" stroke="#333333" stroke-width="1" />

    <!-- Start -->
    <line x1="50" y1="45" x2="50" y2="80" stroke="#474747" stroke-width="2" />
    <text x="55" y="35" fill="#6a6a6a" font-size="11" font-family="monospace">START</text>

    <!-- --- SUBTILE STRECKEN-MARKIERUNGEN --- -->
    <!-- 2 Stunden Marker (25% der Strecke = X: 220) -->
    <g transform="translate(220, 0)">
      <line x1="0" y1="50" x2="0" y2="75" stroke="#333333" stroke-width="1" />
      <text x="0" y="93" fill="#4f4f4f" font-size="10" font-family="monospace" text-anchor="middle">
        2h
      </text>
    </g>

    <!-- 4 Stunden / Halbzeit Marker (50% der Strecke = X: 390) -->
    <g transform="translate(390, 0)">
      <line x1="0" y1="50" x2="0" y2="75" stroke="#474747" stroke-width="1" />
      <text x="0" y="93" fill="#5a5a5a" font-size="10" font-family="monospace" text-anchor="middle">
        4h
      </text>
    </g>

    <!-- 6 Stunden Marker (75% der Strecke = X: 560) -->
    <g transform="translate(560, 0)">
      <line x1="0" y1="50" x2="0" y2="75" stroke="#333333" stroke-width="1" />
      <text x="0" y="93" fill="#4f4f4f" font-size="10" font-family="monospace" text-anchor="middle">
        6h
      </text>
    </g>
    <!-- ------------------------------------- -->

    <!-- Ziel -->
    <g transform="translate(730, 0)">
      <line x1="0" y1="45" x2="0" y2="80" stroke="#474747" stroke-width="2" />
      <line x1="4" y1="45" x2="4" y2="80" stroke="#10b981" stroke-width="2" opacity="0.7" />
      <text x="-30" y="35" fill="#10b981" font-size="11" font-family="monospace" opacity="0.9">
        GOAL
      </text>
    </g>

    <!-- DYNAMISCHER RUNNER -->
    <g transform="translate(0, 62.5)">
      <g class="runner" [style.transform]="'translateX(' + runnerX() + 'px)'">
        <circle cx="0" cy="0" r="4" fill="#2684ff" opacity="0.8" />
      </g>
    </g>
  </svg>
</div>
