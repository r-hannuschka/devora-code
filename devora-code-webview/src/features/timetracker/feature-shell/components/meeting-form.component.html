<h2>Meeting eintragen</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <!-- Datum -->

  <div class="row">
    <div class="lg:col-4">
      <mat-form-field>
        <mat-label>Datum</mat-label>
        <input matInput [matDatepicker]="dp" formControlName="date" />
        <mat-datepicker-toggle matSuffix [for]="dp" />
        <mat-datepicker #dp />
      </mat-form-field>
    </div>

    <div class="sm:col-6 lg:col-4">
      <mat-form-field>
        <mat-label>Von</mat-label>
        <input matInput [matTimepicker]="fromPicker" formControlName="from" />
        <mat-timepicker-toggle matIconSuffix [for]="fromPicker" />
        <mat-timepicker #fromPicker />
      </mat-form-field>
    </div>

    <div class="sm:col-6 lg:col-4">
      <mat-form-field>
        <mat-label>Bis</mat-label>
        <input matInput [matTimepicker]="toPicker" formControlName="to" />
        <mat-timepicker-toggle matIconSuffix [for]="toPicker" />
        <mat-timepicker #toPicker />
      </mat-form-field>
    </div>
    <!-- Von / Bis -->
  </div>

  <!-- Meeting-Nummer -->
  <mat-form-field>
    <mat-label>Meeting-Nummer</mat-label>
    <input matInput formControlName="number" placeholder="z.B. MTG-42" />
  </mat-form-field>

  <!-- Submit -->
  <button mat-flat-button type="submit" color="primary" [disabled]="form.invalid">Speichern</button>
</form>

@if (submitted()) {
  <p class="success">Meeting gespeichert.</p>
}
