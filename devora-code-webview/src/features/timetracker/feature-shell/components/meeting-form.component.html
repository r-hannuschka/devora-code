<h2>Meeting eintragen</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <!-- Datum -->

  <mat-form-field>
    <mat-label>Datum</mat-label>
    <input matInput [matDatepicker]="dp" formControlName="date" />
    <mat-datepicker-toggle matSuffix [for]="dp" />
    <mat-datepicker #dp />
  </mat-form-field>

  <div class="d-flex gap-3">
    <div class="flex-grow">
      <mat-form-field>
        <mat-label>Von</mat-label>
        <input matInput type="time" formControlName="from" />
      </mat-form-field>
    </div>

    <div class="flex-grow">
      <mat-form-field>
        <mat-label>Bis</mat-label>
        <input matInput type="time" formControlName="to" />
      </mat-form-field>
    </div>
  </div>
  <!-- Von / Bis -->

  <!-- Meeting-Nummer -->
  <mat-form-field>
    <mat-label>Meeting-Nummer</mat-label>
    <input matInput formControlName="number" placeholder="z.B. MTG-42" />
  </mat-form-field>

  <!-- Submit -->
  <button mat-flat-button type="submit" color="primary" [disabled]="form.invalid">Speichern</button>
</form>

@if (submitted()) {
  <p class="success">Meeting gespeichert.</p>
}
